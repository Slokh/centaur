[project]
name = "imagegen"
description = "Generate images through OpenRouter's dedicated image API"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
imagegen = "centaur_tool_imagegen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_imagegen"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [{type = "http", name = "OPENROUTER_API_KEY", match_headers = ["Authorization"], hosts = ["openrouter.ai"]}]
