[project]
name = "application"
description = "Call deployment-configured private application capabilities through Centaur"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "typer>=0.12.0"]

[project.scripts]
application = "centaur_tool_application.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["centaur_tool_application"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
