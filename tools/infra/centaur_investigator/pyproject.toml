[project]
name = "centaur_investigator"
description = "Investigate Centaur chat messages and sessions through read-only sources"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
centaur-investigator = "centaur_tool_centaur_investigator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_centaur_investigator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "DISCORD_BOT_TOKEN", mode = "inject", inject_header = "Authorization", inject_formatter = "Bot {{ .Value }}", hosts = ["discord.com"]},
]
